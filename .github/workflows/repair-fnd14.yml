name: Repair FND-0014
on:
  push:
    paths:
      - '.github/workflows/repair-fnd14.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore full source and apply title only
        run: |
          git show f8ee1f3ecf027b9b7f0ed5f1a228833e5d00f3a7:src/content/documents/OTA-FND-0014-2026-DE.md > /tmp/fnd14.md
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/fnd14.md')
          s=p.read_text()
          old='title: "OTA-FND-0014-2026-DE"'
          new='title: "RKF: Anwendung, Validierung und Ressourcen-Integration"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          mv /tmp/fnd14.md src/content/documents/OTA-FND-0014-2026-DE.md
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/documents/OTA-FND-0014-2026-DE.md
          git commit -m "Restore full FND-0014 and set canonical title"
          git push
