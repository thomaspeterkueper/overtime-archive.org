name: Refine Starport dossier

on:
  push:
    branches:
      - research/starport-launcher-tech-object
    paths:
      - '.github/workflows/refine-starport-dossier.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/starport-launcher-tech-object
      - name: Refine evidence wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/content/documents/OTA-TEC-0083-2026-DE.md')
          s = p.read_text()
          s = s.replace('Warum Wiederverwendbarkeit die Ticketpreise so drastisch senkt; warum SSTO bei schwerer Nutzlast an physikalische Grenzen stößt', 'Wie Wiederverwendbarkeit Kostenstrukturen beeinflusst, ohne einen bestimmten Ticketpreis physikalisch zu garantieren; warum SSTO bei schwerer Nutzlast an physikalische Grenzen stößt')
          s = s.replace('Turnaround-Zeit ist der zentrale Wirtschaftlichkeitsfaktor bei einem wiederverwendbaren System — kürzerer Turnaround = höhere Flottenauslastung = niedrigere Stückkosten **[R]**, reales Grundprinzip', 'Turnaround-Zeit ist ein wichtiger Wirtschaftlichkeitsfaktor bei einem wiederverwendbaren System: Kürzerer Turnaround kann die Flottenauslastung erhöhen; die tatsächlichen Stückkosten hängen zusätzlich von Wartung, Lebensdauer, Infrastruktur, Nachfrage und Kapitalkosten ab **[R/H]**.')
          s = s.replace('Abbruchszenarien (Launch Abort) nicht kanonisch spezifiziert **[OFFEN]**, real jedoch ein Standardbestandteil bemannter Trägersysteme', 'Abbruchszenarien (Launch Abort) nicht kanonisch spezifiziert **[OFFEN]**; bemannte Trägersysteme benötigen eine missionsspezifische Strategie zur Rettung bzw. Risikominderung **[R/H]**')
          s = s.replace('thermische Zyklenbelastung ist der Haupttreiber für Wartungsintervalle bei wiederverwendbaren Trägern **[R]**, reales dokumentiertes Problem', 'thermische Zyklenbelastung ist ein relevanter Treiber für Inspektions- und Wartungsbedarf wiederverwendbarer Träger **[R]**; ihre relative Bedeutung gegenüber Triebwerks-, Struktur- und Bodensystemwartung ist systemspezifisch')
          p.write_text(s)
          PY
          rm .github/workflows/refine-starport-dossier.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TEC: tighten Starport evidence boundaries"
          git push origin HEAD:research/starport-launcher-tech-object
