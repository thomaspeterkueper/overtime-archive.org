name: Validate OTA

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  validate-ota:
    name: Validate OTA metadata and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize canonical OTA system metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "  system: SYS:KUEPER:ota"
          new = "  system: SYS:OTA:overtimearchive"
          changed = 0

          for path in Path("src/content/documents").glob("*.md"):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed += 1
              print(f"Normalized kg.system: {path}")

          print(f"Normalized {changed} document(s).")
          PY

      - name: Run OTA metadata validator
        run: python tools/validate_ota_metadata.py .

      - name: Build site and validate internal links
        run: npm run verify

      - name: Apply source-backed canonical titles
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/apply-safe-title-candidates.mjs

      - name: Revalidate after safe editorial fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python tools/validate_ota_metadata.py .
          npm run verify

      - name: Commit safe canonical metadata fixes
        id: commit-fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- src/content/documents; then
            echo "No safe canonical metadata changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/documents
          git commit -m "Apply safe OTA canonical metadata fixes"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh Google Drive after bot commit
        if: steps.commit-fixes.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-google-drive.yml --ref master

      - name: Publish archive quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-archive-quality
          path: src/data/archive-quality.generated.json
          if-no-files-found: error
          retention-days: 30
