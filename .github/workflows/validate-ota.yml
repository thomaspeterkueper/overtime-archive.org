name: Validate OTA

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate-ota:
    name: Validate OTA metadata and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OTA metadata validator
        run: python tools/validate_ota_metadata.py .

      - name: Build site and validate internal links
        run: npm run verify

      - name: Apply source-backed canonical titles
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/apply-safe-title-candidates.mjs

      - name: Revalidate after safe editorial fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python tools/validate_ota_metadata.py .
          npm run verify

      - name: Commit safe editorial fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- src/content/documents; then
            echo "No safe title changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/documents
          git commit -m "Apply source-backed OTA document titles"
          git push

      - name: Publish archive quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-archive-quality
          path: src/data/archive-quality.generated.json
          if-no-files-found: error
          retention-days: 30
