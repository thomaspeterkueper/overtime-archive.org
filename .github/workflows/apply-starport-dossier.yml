name: Apply Starport dossier

on:
  push:
    branches:
      - research/starport-launcher-tech-object
    paths:
      - '.tmp/starport-launcher.md.gz.b64'
      - '.github/workflows/apply-starport-dossier.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/starport-launcher-tech-object
      - name: Decode dossier
        run: |
          mkdir -p src/content/documents
          base64 -d .tmp/starport-launcher.md.gz.b64 | gzip -d > src/content/documents/OTA-TEC-0083-2026-DE.md
          rm .tmp/starport-launcher.md.gz.b64
          rm .github/workflows/apply-starport-dossier.yml
      - name: Commit dossier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TEC: add Starport-Launcher technical object dossier"
          git push origin HEAD:research/starport-launcher-tech-object
