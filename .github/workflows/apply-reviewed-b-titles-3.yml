name: Apply reviewed B titles batch 3
on:
  push:
    branches: [master]
    paths: ['.github/workflows/apply-reviewed-b-titles-3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply reviewed titles only
        shell: python
        run: |
          from pathlib import Path
          import re
          changes = {
            'OTA-BIO-0022-2026-DE.md': 'LILITH ADAR',
            'OTA-FND-0018-2026-DE.md': 'DIE ANUNNAKI-VERZERRUNG',
            'OTA-HIS-0003-2087-DE.md': 'DIE 14 TOTEN VON SEKTOR-7',
            'OTA-HIS-0006-9500BCE-DE.md': 'GÖBEKLI TEPE IM BAUMEISTER-KONTEXT',
            'OTA-HIS-0007-1200BCE-DE.md': 'DER BRONZEZEIT-KOLLAPS',
            'OTA-HIS-0008-MULTI-DE.md': 'DIE ENTSTEHUNG DER SCHRIFT',
            'OTA-KARTE-0003-Baumeister-Netzwerk-DE.md': 'DAS GLOBALE BAUMEISTER-NETZWERK',
            'OTA-NAR-0004-2026-DE.md': 'OTJIZE: Narrative Grundlagen und Epilog-Logik',
            'OTA-ORG-0006-2025-DE.md': 'MARS SAMPLE RETURN',
          }
          root=Path('src/content/documents')
          for name,title in changes.items():
            p=root/name
            raw=p.read_text(encoding='utf-8')
            fm=re.match(r'(?s)^---\s*\n(.*?)\n---',raw)
            assert fm, name
            old=re.search(r'(?m)^title:\s*["\']?([^"\'\n]+)["\']?\s*$',fm.group(1))
            assert old and old.group(1).strip()==name[:-3], (name, old.group(1) if old else None)
            replacement='title: '+repr(title).replace("'", '"')
            new=raw[:fm.start(1)]+re.sub(r'(?m)^title:.*$',replacement,fm.group(1),count=1)+raw[fm.end(1):]
            assert len(new)-len(raw)==len(replacement)-len(re.search(r'(?m)^title:.*$',fm.group(1)).group(0))
            p.write_text(new,encoding='utf-8')
      - name: Validate
        run: |
          python tools/validate_ota_metadata.py
          npm ci
          npm run verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content/documents
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Apply final reviewed B titles'
          git push