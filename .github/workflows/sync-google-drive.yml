name: Sync canonical documents to Google Drive

on:
  push:
    branches:
      - master
    paths:
      - "src/content/documents/**"
      - ".github/workflows/sync-google-drive.yml"
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-sync-overtime-archive
  cancel-in-progress: true

jobs:
  sync:
    name: Sync OverTime Archive documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Google Drive configuration
        id: config
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RCLONE_CONFIG is not configured yet; Drive sync is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rclone
        if: steps.config.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        if: steps.config.outputs.configured == 'true'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd gdrive: >/dev/null

      - name: Validate OTA source
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          count=$(find "src/content/documents" -type f | wc -l)
          echo "Source contains $count files."
          if [ "$count" -lt 100 ]; then
            echo "Refusing sync: OTA source unexpectedly contains fewer than 100 files."
            exit 1
          fi

      - name: Sync canonical OTA documents
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          rclone sync \
            "src/content/documents" \
            "gdrive:OTA/_GITHUB/overtime-archive" \
            --backup-dir "gdrive:OTA/_GITHUB/_sync-history/overtime-archive/${GITHUB_RUN_ID}" \
            --max-delete 25 \
            --create-empty-src-dirs \
            --drive-skip-gdocs \
            --verbose
