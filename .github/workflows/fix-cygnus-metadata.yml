name: Fix CYGNUS metadata
on:
  push:
    branches: [research/cygnus-ctv-tech-object]
    paths: ['.github/workflows/fix-cygnus-metadata.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/cygnus-ctv-tech-object
      - name: Normalize validator-sensitive metadata
        run: |
          sed -i 's/system: "SYS:OTA:overtimearchive"/system: SYS:OTA:overtimearchive/' src/content/documents/OTA-TEC-0082-2026-DE.md
          git config user.name 'kueper-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/documents/OTA-TEC-0082-2026-DE.md
          git commit -m 'TEC: normalize CYGNUS OTA system metadata'
          git push origin HEAD:research/cygnus-ctv-tech-object
