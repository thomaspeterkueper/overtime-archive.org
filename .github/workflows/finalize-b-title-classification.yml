name: Finalize B-title classification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/finalize-b-title-classification.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reclassify remaining structural or ambiguous B candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/analyze-archive-content.mjs')
          s=p.read_text()
          old="""    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)
    || /^(?:\\d+(?:\\.\\d+)*|[A-Z]\\.\\d+)\\.?\\s+\\S/i.test(s)
    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)"""
          new="""    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)
    || /^(?:PART|TEIL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)
    || /^(?:QUERVERWEISE|QUELLENVERZEICHNIS|ABHÄNGIGKEITEN|EMOTIONALE LEXIKA|THERAPIE VS\\. ATHLETIK: VARIANTENÜBERSICHT|ANHANG [A-Z]: LITERATURVERWEISE(?: \\(AUSWAHL\\))?)$/i.test(s)
    || /^(?:\\d+(?:\\.\\d+)*|[A-Z]\\.\\d+)\\.?\\s+\\S/i.test(s)
    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)"""
          if s.count(old)!=1:
              raise SystemExit(f'expected structural block once, got {s.count(old)}')
          s=s.replace(old,new)
          # The RKF index has a signature H1 followed by a subordinate H2. Its H2 is
          # not strong enough evidence for a canonical document title, so it must
          # remain an explicit C decision rather than B.
          old2="""  if (genericTitle) {
    if (derivedTitle?.safe) titleReviewTier = 'A';
    else if (derivedTitle?.value) titleReviewTier = 'B';
    else titleReviewTier = 'C';
  }"""
          new2="""  if (genericTitle) {
    if (derivedTitle?.safe) titleReviewTier = 'A';
    else if (derivedTitle?.value && signature !== 'OTA-INDEX-RKF-2026-DE') titleReviewTier = 'B';
    else titleReviewTier = 'C';
  }"""
          if s.count(old2)!=1:
              raise SystemExit(f'expected tier block once, got {s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - run: npm ci
      - run: npm run verify
      - name: Commit final classification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/analyze-archive-content.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize remaining B-title classification'
          git clean -fd src/data public >/dev/null 2>&1 || true
          git pull --rebase origin master
          git push origin HEAD:master