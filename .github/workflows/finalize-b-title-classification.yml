name: Finalize B-title classification
'on':
  push:
    branches: [master]
    paths: ['.github/workflows/finalize-b-title-classification.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reclassify remaining structural or ambiguous B candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/analyze-archive-content.mjs')
          s=p.read_text()
          old=(
              "    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)\n"
              "    || /^(?:\\d+(?:\\.\\d+)*|[A-Z]\\.\\d+)\\.?\\s+\\S/i.test(s)\n"
              "    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)"
          )
          new=(
              "    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)\n"
              "    || /^(?:PART|TEIL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)\n"
              "    || /^(?:QUERVERWEISE|QUELLENVERZEICHNIS|ABHÄNGIGKEITEN|EMOTIONALE LEXIKA|THERAPIE VS\\. ATHLETIK: VARIANTENÜBERSICHT|ANHANG [A-Z]: LITERATURVERWEISE(?: \\(AUSWAHL\\))?)$/i.test(s)\n"
              "    || /^(?:\\d+(?:\\.\\d+)*|[A-Z]\\.\\d+)\\.?\\s+\\S/i.test(s)\n"
              "    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)"
          )
          if s.count(old)!=1:
              raise SystemExit(f'expected structural block once, got {s.count(old)}')
          s=s.replace(old,new)
          old2=(
              "  let titleReview={tier:'OK',candidate:null,evidence:'canonical-title'};\n"
              "  if(genericTitle&&safeTitle)titleReview={tier:'A',candidate:safeTitle,evidence:'explicit-labeled-field'};\n"
              "  else if(genericTitle&&derivedTitle)titleReview={tier:'B',candidate:derivedTitle,evidence:'first-non-structural-heading'};\n"
              "  else if(genericTitle)titleReview={tier:'C',candidate:null,evidence:'editorial-decision-required'};"
          )
          new2=(
              "  let titleReview={tier:'OK',candidate:null,evidence:'canonical-title'};\n"
              "  if(genericTitle&&safeTitle)titleReview={tier:'A',candidate:safeTitle,evidence:'explicit-labeled-field'};\n"
              "  else if(genericTitle&&derivedTitle&&signature!=='OTA-INDEX-RKF-2026-DE')titleReview={tier:'B',candidate:derivedTitle,evidence:'first-non-structural-heading'};\n"
              "  else if(genericTitle)titleReview={tier:'C',candidate:null,evidence:'editorial-decision-required'};"
          )
          if s.count(old2)!=1:
              raise SystemExit(f'expected tier block once, got {s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - run: npm ci
      - run: npm run verify
      - name: Commit final classification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/analyze-archive-content.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize remaining B-title classification'
          git clean -fd src/data public >/dev/null 2>&1 || true
          git pull --rebase origin master
          git push origin HEAD:master
