name: Apply Tech Evidence v1.1

on:
  push:
    branches:
      - research/tech-evidence-v1-1-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tech-evidence-v1-1-apply
      - name: Apply evidence migration
        run: python3 tools/apply-tech-evidence-v1-1.py
      - name: Commit migrated dossiers
        run: |
          if git diff --quiet -- src/content/documents/OTA-TEC-0034-2026-DE.md src/content/documents/OTA-TEC-0036-2026-DE.md src/content/documents/OTA-TEC-0037-2026-DE.md; then
            echo "No dossier changes required"
            exit 0
          fi
          git config user.name "kueper-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/documents/OTA-TEC-0034-2026-DE.md src/content/documents/OTA-TEC-0036-2026-DE.md src/content/documents/OTA-TEC-0037-2026-DE.md
          git commit -m "TEC: apply evidence audits to 0034 0036 0037"
          git push origin HEAD:research/tech-evidence-v1-1-apply
