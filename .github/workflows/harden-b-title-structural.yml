name: Harden B-title structural filtering
on:
  push:
    branches: [master]
    paths: ['.github/workflows/harden-b-title-structural.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden structural title filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/analyze-archive-content.mjs')
          s=p.read_text()
          old="""  return /^(?:THE OVERTIME ARCHIVE|METADATEN|INHALT|EINLEITUNG|ZUSAMMENFASSUNG|ABSTRACT|CURATORIAL NOTE|ANHANG|VORBEMERKUNG|EPISTEMOLOGISCHE GEWICHTUNG|TITEL|BEZIEHUNG ZUM HAUPTDOKUMENT)$/i.test(s)\n    || /^(?:[A-ZÄÖÜ][A-ZÄÖÜ -]*\\s+)?(?:DOCUMENT|DOCUMENTATION|CONTEXT|FOUNDATIONAL|CULTURAL|HISTORICAL|BIOGRAPHICAL|SCIENTIFIC|TECHNICAL|CARTOGRAPHIC|OBSERVATIONAL|ORGANIZATIONAL)\\s+SERIES$/i.test(s)\n    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)\n    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)\n    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+$/i.test(s);"""
          new="""  return /^(?:THE OVERTIME ARCHIVE|METADATEN|INHALT|INHALTSVERZEICHNIS|EINLEITUNG|ZUSAMMENFASSUNG|ABSTRACT|CURATORIAL NOTE|ANHANG|VORBEMERKUNG|EPISTEMOLOGISCHE GEWICHTUNG|EPISTEMISCHE TRANSPARENZ & WARNUNG|TITEL|DOKUMENTSTRUKTUR|REVISIONSHISTORIE|REDAKTIONELLE SYNTHESE|BEZIEHUNG ZUM HAUPTDOKUMENT)$/i.test(s)\n    || /^(?:[A-ZÄÖÜ][A-ZÄÖÜ -]*\\s+)?(?:DOCUMENTS?|DOCUMENTATION|PUBLICATIONS?|CONTEXT|FOUNDATIONAL|CULTURAL|HISTORICAL|BIOGRAPHICAL|SCIENTIFIC|TECHNICAL|CARTOGRAPHIC|OBSERVED REALITY|OBSERVATIONAL|ORGANIZATIONAL)\\s+SERIES$/i.test(s)\n    || /^ÄNDERUNGSPROTOKOLL(?:\\s+V?\\d+(?:\\.\\d+)*)?$/i.test(s)\n    || /^(?:\\d+(?:\\.\\d+)*|[A-Z]\\.\\d+)\\.?\\s+\\S/i.test(s)\n    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+\\s*[:—–-]/i.test(s)\n    || /^(?:TEIL|SECTION|KAPITEL|CHAPTER|MODUL|PROTOKOLL)\\s+[A-Z0-9IVX]+$/i.test(s);"""
          if s.count(old)!=1:
              raise SystemExit(f'expected structural block once, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: npm run verify
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/analyze-archive-content.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Harden structural B-title classification'
          git reset --hard HEAD
          git pull --rebase origin master
          git push origin HEAD:master
