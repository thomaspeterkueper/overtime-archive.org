name: Restore RKF document

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/restore-fnd13.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore source document and apply title only
        run: |
          git checkout d2f9ab794d471611458aed0211709010ce8e9d27 -- src/content/documents/OTA-FND-0013-2026-DE.md
          python - <<'PY'
          from pathlib import Path
          p=Path('src/content/documents/OTA-FND-0013-2026-DE.md')
          s=p.read_text(encoding='utf-8')
          old='title: "OTA-FND-0013-2026-DE"'
          new='title: "Resonanzklassifikations-Formalismus (RKF)"'
          if old not in s:
              raise SystemExit('Expected generic title not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/documents/OTA-FND-0013-2026-DE.md
          git commit -m "Restore full RKF document and use documented title"
          git push
