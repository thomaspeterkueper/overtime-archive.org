name: Finish OTA title pass
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/finish-title-pass.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed titles and dispositions
        run: |
          python - <<'PY'
          from pathlib import Path
          titles = {
            'OTA-KARTE-0001-Gehirn-Epochen.md': 'DIE FÜNF GEHIRN-EPOCHEN — Referenzmodul',
            'OTA-TEC-0021-2025-DE.md': 'MOF-STABILISIERUNG FÜR SUPERIONISCHES GOLDHYDRID',
            'OTA-OBS-0004-2026-DE.md': 'GÖBEKLI TEPE',
            'OTA-SCI-0010-2025-DE.md': 'VON DER STRATIGRAPHIE ZUR FREQUENZANALYSE',
            'OTA-SCI-0019-2025-DE.md': 'DIE FÜNF EPOCHEN DES GEHIRNS',
          }
          root=Path('src/content/documents')
          for fn,title in titles.items():
            p=root/fn; s=p.read_text(encoding='utf-8'); sig=fn[:-3]; old=f'title: "{sig}"'
            if s.count(old)!=1: raise SystemExit(f'{fn}: expected exactly one generic title, got {s.count(old)}')
            p.write_text(s.replace(old, 'title: '+__import__('json').dumps(title, ensure_ascii=False), 1), encoding='utf-8')
          p=Path('scripts/analyze-archive-content.mjs'); s=p.read_text(encoding='utf-8')
          anchor="function firstHeadingCandidate(body,sig){"
          insert="""const reviewedAmbiguousTitleSignatures = new Set([\n  'OTA-SCI-0030-2090-DE',\n  'OTA-CUL-0013-MULTI-DE',\n  'OTA-FND-0012-2026-DE',\n  'OTA-SCI-0026-2048-DE',\n]);\n\n"""
          if 'reviewedAmbiguousTitleSignatures' not in s:
            if s.count(anchor)!=1: raise SystemExit('analyzer anchor missing')
            s=s.replace(anchor,insert+anchor,1)
          old="else if(genericTitle&&derivedTitle&&signature!=='OTA-INDEX-RKF-2026-DE')titleReview={tier:'B',candidate:derivedTitle,evidence:'first-non-structural-heading'};"
          new="else if(genericTitle&&derivedTitle&&signature!=='OTA-INDEX-RKF-2026-DE'&&!reviewedAmbiguousTitleSignatures.has(signature))titleReview={tier:'B',candidate:derivedTitle,evidence:'first-non-structural-heading'};"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('title-review expression missing')
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm ci
      - run: python tools/validate_ota_metadata.py src/content/documents
      - run: npm run verify
      - name: Assert title pass complete
        run: |
          node - <<'NODE'
          const q=require('./src/data/archive-quality.generated.json');
          if(q.summary.titleReviewA!==0 || q.summary.titleReviewB!==0) { console.error(q.summary); process.exit(1); }
          console.log(q.summary);
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/documents scripts/analyze-archive-content.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Complete reviewed OTA title pass'
          git reset --hard HEAD
          git clean -fd src/data public >/dev/null 2>&1 || true
          git pull --rebase origin master
          git push origin HEAD:master
